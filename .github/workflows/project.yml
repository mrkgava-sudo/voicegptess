
name: VoiceAssistant

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  VoiceAssistant:
    type: application
    platform: iOS
    sources:
      - path: VoiceAssistant
        excludes:
          - Info.plist
    info:
      path: VoiceAssistant/Info.plist
      properties:
        CFBundleDisplayName: Голосовой помощник
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых команд.
        NSSpeechRecognitionUsageDescription: Нужно для распознавания речи.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.voiceassistant
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
